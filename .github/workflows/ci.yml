name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: yarn install --frozen-lockfile
      - run: cd server && yarn install --frozen-lockfile

      - run: yarn lint:all
      - run: yarn test
      - run: cd server && yarn test
