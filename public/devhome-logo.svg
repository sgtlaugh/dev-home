<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b9eff"/>
      <stop offset="100%" stop-color="#0969da"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)"/>
  <!-- House roof -->
  <path d="M256 100 L420 230 L400 230 L400 400 Q400 416 384 416 L128 416 Q112 416 112 400 L112 230 L92 230 Z"
        fill="none" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Code brackets </> inside house -->
  <polyline points="220,260 170,310 220,360"
            fill="none" stroke="#3b9eff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="292,260 342,310 292,360"
            fill="none" stroke="#3b9eff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="270" y1="245" x2="242" y2="375"
        stroke="#3b9eff" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
</svg>
